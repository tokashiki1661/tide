<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌕</text></svg>">
<title>大度イノー 潮カレンダー</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700;900&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ocean-deep: #0a1628;
    --ocean-mid: #0d2240;
    --ocean-surface: #103257;
    --tide-low: #38bdf8;
    --tide-high: #0ea5e9;
    --moon-full: #fde68a;
    --moon-new: #94a3b8;
    --good: #34d399;
    --warning: #f59e0b;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--ocean-deep);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 背景の波アニメーション */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 20% 80%, rgba(56,189,248,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 20%, rgba(14,165,233,0.05) 0%, transparent 50%),
      linear-gradient(180deg, #0a1628 0%, #0d2240 50%, #071020 100%);
    z-index: 0;
    pointer-events: none;
  }

  .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 0 80px; }

  /* ヘッダー */
  header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--glass-border);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .app-title {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--tide-low);
    font-weight: 300;
    text-transform: uppercase;
  }
  .location {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .date-display {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .date-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    font-weight: 300;
  }

  /* タブ */
  .tabs {
    display: flex;
    padding: 12px 20px 0;
    gap: 4px;
    border-bottom: 1px solid var(--glass-border);
  }
  .tab {
    padding: 8px 16px;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text-dim);
    border: none;
    background: transparent;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--glass);
    color: var(--tide-low);
    border: 1px solid var(--glass-border);
    border-bottom: 1px solid var(--ocean-deep);
    margin-bottom: -1px;
  }

  /* パネル */
  .panel { display: none; padding: 20px; }
  .panel.active { display: block; }

  /* 今日カード */
  .today-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 24px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .today-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 70%);
  }

  .moon-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .moon-icon { font-size: 28px; }
  .moon-info { }
  .tide-type {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .tide-type.大潮 { color: var(--tide-low); }
  .tide-type.中潮 { color: #7dd3fc; }
  .tide-type.小潮 { color: #94a3b8; }
  .tide-type.長潮 { color: #c084fc; }
  .tide-type.若潮 { color: #a78bfa; }
  .moon-age { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* 行きどき判定 */
  .goto-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 20px;
    width: 100%;
    justify-content: center;
  }
  .goto-badge.excellent {
    background: rgba(52,211,153,0.15);
    border: 1px solid rgba(52,211,153,0.4);
    color: var(--good);
  }
  .goto-badge.good {
    background: rgba(56,189,248,0.1);
    border: 1px solid rgba(56,189,248,0.3);
    color: var(--tide-low);
  }
  .goto-badge.normal {
    background: rgba(100,116,139,0.1);
    border: 1px solid rgba(100,116,139,0.2);
    color: var(--text-dim);
  }

  /* 潮汐グラフ */
  .tide-graph-wrap {
    margin-bottom: 20px;
    position: relative;
  }
  .tide-graph-label {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.1em;
  }
  canvas.tide-wave { width: 100%; height: 80px; border-radius: 10px; }

  /* 干満テーブル */
  .tide-times {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .tide-entry {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 12px 14px;
    position: relative;
  }
  .tide-entry.low { border-left: 3px solid var(--tide-low); }
  .tide-entry.high { border-left: 3px solid rgba(56,189,248,0.3); }
  .tide-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
  .tide-time {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .tide-entry.low .tide-time { color: var(--tide-low); }
  .tide-entry.high .tide-time { color: #7dd3fc; }
  .tide-height {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .best-mark {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 10px;
    background: rgba(52,211,153,0.2);
    color: var(--good);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
  }

  /* 干潮カウントダウン */
  .countdown-card {
    background: linear-gradient(135deg, rgba(56,189,248,0.1), rgba(14,165,233,0.05));
    border: 1px solid rgba(56,189,248,0.2);
    border-radius: 16px;
    padding: 16px 18px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .countdown-icon { font-size: 24px; }
  .countdown-label { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .countdown-time {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    color: var(--tide-low);
    font-weight: 400;
  }

  /* カレンダーパネル */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .month-title { font-size: 18px; font-weight: 900; }
  .nav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .nav-btn:active { background: rgba(56,189,248,0.15); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-dow {
    text-align: center;
    font-size: 9px;
    color: var(--text-dim);
    padding: 4px 0 6px;
    letter-spacing: 0.05em;
  }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    border: 1px solid transparent;
    padding: 2px;
  }
  .cal-cell:active { transform: scale(0.92); }
  .cal-cell.empty { cursor: default; }
  .cal-cell.today {
    border-color: var(--tide-low);
    background: rgba(56,189,248,0.08);
  }
  .cal-cell.selected {
    background: rgba(56,189,248,0.2);
    border-color: var(--tide-low);
  }
  .cal-cell.excellent-day { background: rgba(52,211,153,0.12); }
  .cal-cell.good-day { background: rgba(56,189,248,0.07); }

  .cal-date {
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }
  .cal-cell.today .cal-date { color: var(--tide-low); }
  .cal-moon {
    font-size: 8px;
    margin-top: 1px;
    line-height: 1;
  }
  .cal-low-time {
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    color: var(--tide-low);
    margin-top: 1px;
    line-height: 1;
  }
  .tide-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    margin-top: 2px;
  }
  .tide-dot.excellent { background: var(--good); }
  .tide-dot.good { background: var(--tide-low); }
  .tide-dot.normal { background: var(--text-dim); }

  /* 選択日の詳細 */
  .detail-card {
    margin-top: 16px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px;
  }
  .detail-title {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }
  .detail-times {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  /* 凡例 */
  .legend {
    display: flex;
    gap: 14px;
    margin-top: 14px;
    padding: 10px 14px;
    background: var(--glass);
    border-radius: 10px;
    border: 1px solid var(--glass-border);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text-dim);
  }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ボトムナビ */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,22,40,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
    display: flex;
    padding: 8px 0 env(safe-area-inset-bottom, 8px);
    z-index: 100;
    max-width: 480px;
    margin: 0 auto;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 10px;
    transition: color 0.2s;
    border: none;
    background: transparent;
  }
  .nav-item.active { color: var(--tide-low); }
  .nav-item span { font-size: 20px; }

  /* アニメ */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .panel.active { animation: fadeIn 0.25s ease; }

  /* 週間パネル */
  .week-list { display: flex; flex-direction: column; gap: 10px; }
  .week-item {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .week-item:active { background: rgba(56,189,248,0.1); }
  .week-item.excellent { border-left: 3px solid var(--good); }
  .week-item.good { border-left: 3px solid var(--tide-low); }
  .week-item.today-row { background: rgba(56,189,248,0.07); }
  .week-date-col { width: 44px; text-align: center; }
  .week-dow { font-size: 10px; color: var(--text-dim); }
  .week-day { font-size: 20px; font-weight: 900; line-height: 1.1; }
  .week-moon-col { font-size: 20px; }
  .week-info { flex: 1; }
  .week-type { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .week-times { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .week-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
  }
  .week-badge.excellent { background: rgba(52,211,153,0.2); color: var(--good); }
  .week-badge.good { background: rgba(56,189,248,0.15); color: var(--tide-low); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-top">
      <span class="app-title">🌊 大度イノー 潮カレンダー</span>
      <span class="location">糸満市 大度海岸</span>
    </div>
    <div class="date-display" id="headerDate">—</div>
    <div class="date-sub" id="headerSub">—</div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('today', this)">今日</button>
    <button class="tab" onclick="switchTab('week', this)">週間</button>
    <button class="tab" onclick="switchTab('calendar', this)">カレンダー</button>
  </div>

  <!-- 今日パネル -->
  <div class="panel active" id="panel-today">
    <div class="today-card">
      <div class="moon-row">
        <div class="moon-icon" id="todayMoonIcon">🌕</div>
        <div class="moon-info">
          <div class="tide-type" id="todayTideType">大潮</div>
          <div class="moon-age" id="todayMoonAge">月齢 —</div>
        </div>
      </div>
      <div class="goto-badge excellent" id="todayBadge">
        <span>🐚</span>
        <span id="todayBadgeText">今日は磯採集の好機！</span>
      </div>
      <div class="tide-graph-wrap">
        <div class="tide-graph-label">24時間の潮位グラフ</div>
        <canvas id="tideCanvas" class="tide-wave" width="440" height="80"></canvas>
      </div>
      <div class="tide-times" id="todayTideTimes"></div>
      <div class="countdown-card" id="countdownCard">
        <div class="countdown-icon">⏱</div>
        <div>
          <div class="countdown-label">次の干潮まで</div>
          <div class="countdown-time" id="countdownTime">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 週間パネル -->
  <div class="panel" id="panel-week">
    <div class="week-list" id="weekList"></div>
  </div>

  <!-- カレンダーパネル -->
  <div class="panel" id="panel-calendar">
    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="monthTitle">—</div>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <div class="legend-item"><div class="leg-dot" style="background:var(--good)"></div>ベスト</div>
      <div class="legend-item"><div class="leg-dot" style="background:var(--tide-low)"></div>おすすめ</div>
      <div class="legend-item"><div class="leg-dot" style="background:var(--text-dim)"></div>ふつう</div>
    </div>
    <div class="detail-card" id="detailCard" style="display:none">
      <div class="detail-title" id="detailTitle">—</div>
      <div class="detail-times" id="detailTimes"></div>
    </div>
  </div>
</div>

<script>
// ==================== 潮汐計算エンジン ====================
// 沖縄・糸満エリアの潮汐パラメータ（近似値）
const TIDE_PARAMS = {
  // 沖縄は半日周期潮
  M2: { amp: 0.55, speed: 28.9841 },   // 主太陰半日周期
  S2: { amp: 0.22, speed: 30.0000 },   // 主太陽半日周期
  K1: { amp: 0.15, speed: 15.0411 },   // 太陰太陽日周期
  O1: { amp: 0.12, speed: 13.9430 },   // 主太陰日周期
  N2: { amp: 0.10, speed: 28.4397 },   // 楕円半日周期
};

const MEAN_LEVEL = 1.0; // 平均水位(m)

function calcTideHeight(date) {
  const t = (date - new Date(2024, 0, 1)) / (1000 * 3600);
  let h = MEAN_LEVEL;
  // 初期位相（糸満の実測に近づける）
  const phases = { M2: 220, S2: 180, K1: 320, O1: 280, N2: 200 };
  for (const [name, p] of Object.entries(TIDE_PARAMS)) {
    const angle = (p.speed * t + phases[name]) * Math.PI / 180;
    h += p.amp * Math.cos(angle);
  }
  return Math.max(0, h);
}

function getMoonAge(date) {
  const known = new Date(2000, 0, 6, 18, 14); // 既知の新月
  const diff = (date - known) / (1000 * 3600 * 24);
  return ((diff % 29.53059) + 29.53059) % 29.53059;
}

function getMoonIcon(age) {
  if (age < 1.5) return '🌑';
  if (age < 6.5) return '🌒';
  if (age < 8.5) return '🌓';
  if (age < 13.5) return '🌔';
  if (age < 15.5) return '🌕';
  if (age < 20.5) return '🌖';
  if (age < 22.5) return '🌗';
  if (age < 27.5) return '🌘';
  return '🌑';
}

function getTideTypeName(age) {
  // 大潮: 新月・満月前後2日
  const d = Math.min(age, 29.53 - age);
  const d2 = Math.min(Math.abs(age - 14.77), age, 29.53 - age);
  const nearNewOrFull = Math.min(age % 29.53, Math.abs(age - 14.77));
  if (nearNewOrFull <= 2.5) return '大潮';
  if (nearNewOrFull <= 4.5) return '中潮';
  if (nearNewOrFull <= 6) return '小潮';
  if (nearNewOrFull <= 7) return '長潮';
  if (nearNewOrFull <= 8) return '若潮';
  if (nearNewOrFull <= 10) return '中潮';
  return '小潮';
}

function getDayTides(date) {
  const samples = [];
  for (let m = 0; m < 1440; m += 5) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, m);
    samples.push({ min: m, h: calcTideHeight(d) });
  }
  
  const lows = [], highs = [];
  for (let i = 1; i < samples.length - 1; i++) {
    if (samples[i].h < samples[i-1].h && samples[i].h < samples[i+1].h) {
      lows.push(samples[i]);
    }
    if (samples[i].h > samples[i-1].h && samples[i].h > samples[i+1].h) {
      highs.push(samples[i]);
    }
  }
  return { lows, highs, samples };
}

function minutesToTime(min) {
  const h = Math.floor(min / 60) % 24;
  const m = min % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function getGoLevel(moonAge, lows) {
  const tideType = getTideTypeName(moonAge);
  const minLow = lows.length ? Math.min(...lows.map(l => l.h)) : 1;
  
  if ((tideType === '大潮') && minLow < 0.6) return 'excellent';
  if ((tideType === '大潮' || tideType === '中潮') && minLow < 0.8) return 'good';
  if (tideType === '中潮') return 'good';
  return 'normal';
}

// ==================== 今日パネル ====================
function renderToday() {
  const now = new Date();
  const dow = ['日','月','火','水','木','金','土'];
  document.getElementById('headerDate').textContent = 
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${dow[now.getDay()]}）`;
  document.getElementById('headerSub').textContent = 
    `現在時刻 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const moonAge = getMoonAge(now);
  const tideType = getTideTypeName(moonAge);
  document.getElementById('todayMoonIcon').textContent = getMoonIcon(moonAge);
  document.getElementById('todayTideType').textContent = tideType;
  document.getElementById('todayTideType').className = `tide-type ${tideType}`;
  document.getElementById('todayMoonAge').textContent = `月齢 ${moonAge.toFixed(1)}`;

  const { lows, highs, samples } = getDayTides(now);
  const level = getGoLevel(moonAge, lows);

  // バッジ
  const badge = document.getElementById('todayBadge');
  const badgeText = document.getElementById('todayBadgeText');
  badge.className = `goto-badge ${level}`;
  if (level === 'excellent') {
    badge.querySelector('span').textContent = '🐚';
    badgeText.textContent = '今日は磯採集のベストデイ！';
  } else if (level === 'good') {
    badge.querySelector('span').textContent = '🌊';
    badgeText.textContent = '磯採集におすすめの日';
  } else {
    badge.querySelector('span').textContent = '🌀';
    badgeText.textContent = '潮の引きは控えめ';
  }

  // グラフ描画
  drawTideGraph(samples, now);

  // 干満テーブル
  const container = document.getElementById('todayTideTimes');
  container.innerHTML = '';
  const entries = [];
  lows.forEach(l => entries.push({ type: 'low', ...l }));
  highs.forEach(h => entries.push({ type: 'high', ...h }));
  entries.sort((a, b) => a.min - b.min);

  const minLowH = lows.length ? Math.min(...lows.map(l => l.h)) : 99;

  entries.forEach(e => {
    const div = document.createElement('div');
    div.className = `tide-entry ${e.type}`;
    const isBest = e.type === 'low' && Math.abs(e.h - minLowH) < 0.01;
    div.innerHTML = `
      <div class="tide-label">${e.type === 'low' ? '干潮' : '満潮'}</div>
      <div class="tide-time">${minutesToTime(e.min)}</div>
      <div class="tide-height">${e.h.toFixed(2)}m</div>
      ${isBest ? '<div class="best-mark">ベスト</div>' : ''}
    `;
    container.appendChild(div);
  });

  // カウントダウン
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nextLow = lows.find(l => l.min > nowMin) || lows[0];
  if (nextLow) {
    let diff = nextLow.min - nowMin;
    if (diff < 0) diff += 1440;
    const h = Math.floor(diff / 60);
    const m = diff % 60;
    document.getElementById('countdownTime').textContent = 
      h > 0 ? `${h}時間${m}分後` : `${m}分後`;
  }
}

function drawTideGraph(samples, now) {
  const canvas = document.getElementById('tideCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const heights = samples.map(s => s.h);
  const minH = Math.min(...heights), maxH = Math.max(...heights);
  const range = maxH - minH || 1;

  const pts = samples.map((s, i) => ({
    x: (i / (samples.length - 1)) * W,
    y: H - ((s.h - minH) / range) * (H - 12) - 4
  }));

  // グラデーション塗りつぶし
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(56,189,248,0.4)');
  grad.addColorStop(1, 'rgba(56,189,248,0.02)');
  
  ctx.beginPath();
  ctx.moveTo(0, H);
  pts.forEach((p, i) => i === 0 ? ctx.lineTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // 波線
  ctx.beginPath();
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 現在時刻ライン
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nx = (nowMin / 1440) * W;
  ctx.beginPath();
  ctx.moveTo(nx, 0);
  ctx.lineTo(nx, H);
  ctx.strokeStyle = 'rgba(253,230,138,0.8)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 3]);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // NOW ラベル
  ctx.fillStyle = 'rgba(253,230,138,0.9)';
  ctx.font = '9px DM Mono, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('NOW', nx, 10);
}

// ==================== 週間パネル ====================
function renderWeek() {
  const list = document.getElementById('weekList');
  list.innerHTML = '';
  const today = new Date();
  const dow = ['日','月','火','水','木','金','土'];

  for (let i = 0; i < 14; i++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    const moonAge = getMoonAge(d);
    const tideType = getTideTypeName(moonAge);
    const { lows, highs } = getDayTides(d);
    const level = getGoLevel(moonAge, lows);
    const isToday = i === 0;

    const item = document.createElement('div');
    item.className = `week-item ${level} ${isToday ? 'today-row' : ''}`;

    const minLow = lows.length ? lows.reduce((a, b) => a.h < b.h ? a : b) : null;
    const lowTimes = lows.map(l => minutesToTime(l.min)).join(' / ');

    item.innerHTML = `
      <div class="week-date-col">
        <div class="week-dow">${dow[d.getDay()]}</div>
        <div class="week-day">${d.getDate()}</div>
      </div>
      <div class="week-moon-col">${getMoonIcon(moonAge)}</div>
      <div class="week-info">
        <div class="week-type ${tideType}">${tideType}</div>
        <div class="week-times">干潮 ${lowTimes || '—'}</div>
        ${minLow ? `<div class="week-times">${minLow.h.toFixed(2)}m</div>` : ''}
      </div>
      ${level !== 'normal' ? `<div class="week-badge ${level}">${level === 'excellent' ? 'ベスト' : 'おすすめ'}</div>` : ''}
    `;
    list.appendChild(item);
  }
}

// ==================== カレンダーパネル ====================
let calYear, calMonth;

function renderCalendar() {
  const title = document.getElementById('monthTitle');
  title.textContent = `${calYear}年${calMonth + 1}月`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  
  const dows = ['日','月','火','水','木','金','土'];
  dows.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const first = new Date(calYear, calMonth, 1);
  const totalDays = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();

  // 空白
  for (let i = 0; i < first.getDay(); i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }

  for (let day = 1; day <= totalDays; day++) {
    const d = new Date(calYear, calMonth, day);
    const moonAge = getMoonAge(d);
    const { lows } = getDayTides(d);
    const level = getGoLevel(moonAge, lows);
    const isToday = d.toDateString() === today.toDateString();
    
    const minLow = lows.length ? lows.reduce((a, b) => a.h < b.h ? a : b) : null;

    const cell = document.createElement('div');
    cell.className = `cal-cell ${isToday ? 'today' : ''} ${level === 'excellent' ? 'excellent-day' : level === 'good' ? 'good-day' : ''}`;
    cell.innerHTML = `
      <div class="cal-date">${day}</div>
      <div class="cal-moon">${getMoonIcon(moonAge)}</div>
      ${minLow ? `<div class="cal-low-time">${minutesToTime(minLow.min)}</div>` : ''}
      <div class="tide-dot ${level}"></div>
    `;
    cell.onclick = () => showDetail(d);
    grid.appendChild(cell);
  }
}

function showDetail(date) {
  const card = document.getElementById('detailCard');
  card.style.display = 'block';
  const dow = ['日','月','火','水','木','金','土'];
  document.getElementById('detailTitle').textContent = 
    `${date.getMonth()+1}月${date.getDate()}日（${dow[date.getDay()]}）の詳細`;

  const moonAge = getMoonAge(date);
  const tideType = getTideTypeName(moonAge);
  const { lows, highs } = getDayTides(date);
  const container = document.getElementById('detailTimes');
  container.innerHTML = '';

  const minLowH = lows.length ? Math.min(...lows.map(l => l.h)) : 99;
  const entries = [];
  lows.forEach(l => entries.push({ type: 'low', ...l }));
  highs.forEach(h => entries.push({ type: 'high', ...h }));
  entries.sort((a, b) => a.min - b.min);

  entries.forEach(e => {
    const div = document.createElement('div');
    div.className = `tide-entry ${e.type}`;
    const isBest = e.type === 'low' && Math.abs(e.h - minLowH) < 0.01;
    div.innerHTML = `
      <div class="tide-label">${e.type === 'low' ? '干潮' : '満潮'}</div>
      <div class="tide-time">${minutesToTime(e.min)}</div>
      <div class="tide-height">${e.h.toFixed(2)}m · ${tideType}</div>
      ${isBest ? '<div class="best-mark">ベスト</div>' : ''}
    `;
    container.appendChild(div);
  });
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
  document.getElementById('detailCard').style.display = 'none';
}

// ==================== タブ切り替え ====================
function switchTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`panel-${id}`).classList.add('active');
  btn.classList.add('active');
}

// ==================== 初期化 ====================
window.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();

  renderToday();
  renderWeek();
  renderCalendar();

  // 毎分更新
  setInterval(() => {
    renderToday();
    const headerSub = document.getElementById('headerSub');
    const n = new Date();
    headerSub.textContent = `現在時刻 ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  }, 60000);
});
</script>
